name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare game files
        shell: bash
        run: |
          mkdir -p game
          curl -L -o game/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
          sed 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' gazyava-i-hrumki.html > game/index.html
          if [ -f icon.png ]; then mkdir -p build && cp icon.png build/icon.png; fi

      - run: npm install

      - name: Build exe
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: Gazyava-i-Hrumki-windows
          path: dist/*.exe
